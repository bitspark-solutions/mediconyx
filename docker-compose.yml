
services:
  db:
    image: postgres:18-alpine3.22
    container_name: mediconyx-db
    networks:
      - mediconyx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mediconyx
    ports:
      - "9543:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: mediconyx-api/Dockerfile
    container_name: mediconyx-api
    networks:
      - mediconyx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=mediconyx;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: Mediconyx
      JwtSettings__Audience: MediconyxAPI
      JwtSettings__ExpiryMinutes: "60"
      FrontendUrl: http://localhost:9673
      MasterUser__Email: ${MASTER_EMAIL}
      MasterUser__Password: ${MASTER_PASSWORD}
      MasterUser__FirstName: ${MASTER_FIRST_NAME}
      MasterUser__LastName: ${MASTER_LAST_NAME}
      REDIS_CONNECTION: redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    ports:
      - "9765:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  ui:
    build:
      context: ./mediconyx-ui
      dockerfile: Dockerfile
    container_name: mediconyx-ui
    networks:
      - mediconyx
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:9765
    ports:
      - "9673:3000"
    depends_on:
      api:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: mediconyx-redis
    networks:
      - mediconyx
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mediconyx-mailhog
    networks:
      - mediconyx
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

networks:
  mediconyx:
    driver: bridge

volumes:
  db_data:
