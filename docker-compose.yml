services:
  db:
    image: postgres:18-alpine3.22
    container_name: mediconyx-db
    networks:
      - mediconyx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mediconyx
    ports:
      - "9543:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: mediconyx-api/Dockerfile
    container_name: mediconyx-api
    networks:
      - mediconyx
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=mediconyx;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: Mediconyx
      JwtSettings__Audience: MediconyxAPI
      JwtSettings__ExpiryMinutes: "60"
      FrontendUrl: http://localhost:9673
      MasterUser__Email: ${MASTER_EMAIL}
      MasterUser__Password: ${MASTER_PASSWORD}
      MasterUser__FirstName: ${MASTER_FIRST_NAME}
      MasterUser__LastName: ${MASTER_LAST_NAME}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      StorageService__BaseUrl: http://storage:8080
    ports:
      - "9765:8080"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
      storage:
        condition: service_started

  ui:
    build:
      context: ./mediconyx-ui
      dockerfile: Dockerfile
    container_name: mediconyx-ui
    networks:
      - mediconyx
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:9765
    ports:
      - "9673:3000"
    depends_on:
      api:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mediconyx-mailhog
    networks:
      - mediconyx
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  storage:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: mediconyx-storage
    networks:
      - mediconyx
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Storage__BasePath: /app/storage
      Storage__MaxFileSizeBytes: "10485760"
    ports:
      - "7890:8080"
    volumes:
      - storage_data:/app/storage

networks:
  mediconyx:
    driver: bridge

volumes:
  db_data:
  storage_data:
